<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theforge studio</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<aside class="panel" id="ajustes">
  <h1>theforge <span>studio</span></h1>

  <section>
    <h2>Forma</h2>
    <label for="curve">Tipo</label>
    <select id="curve"></select>

    <div class="rejilla" id="campos-forma"></div>

    <label for="min_thickness">Grosor mín / máx (mm)</label>
    <div class="fila">
      <input type="number" id="min_thickness" step="0.1" min="0.1" value="0.7">
      <input type="number" id="max_thickness" step="0.1" min="0.2" value="3.0">
    </div>

    <label for="frame_mm">Marco (mm)</label>
    <input type="number" id="frame_mm" step="0.5" min="0" value="6">

    <label for="samples">Muestras a lo ancho</label>
    <input type="number" id="samples" step="50" min="20" value="300">
  </section>

  <section>
    <h2>Fondo</h2>
    <label for="pattern">Patrón</label>
    <select id="pattern"></select>
    <div id="fila-gris" hidden>
      <label for="gray">Gris del fondo</label>
      <input type="range" id="gray" min="0" max="255" value="205">
    </div>
  </section>

  <section>
    <h2>Proyecto</h2>
    <button id="btn-guardar">Guardar proyecto</button>
    <button id="btn-cargar">Cargar proyecto</button>
    <input type="file" id="fichero-proyecto" accept=".json" hidden>
    <button id="btn-exportar" class="principal">Exportar STL</button>
  </section>

  <div id="estado"></div>
  <div id="avisos"></div>
</aside>

<main>
  <div class="pestanas" role="tablist">
    <button data-vista="banda" aria-selected="true">Banda</button>
    <button data-vista="encendida" aria-selected="false">Encendida</button>
    <button data-vista="modelo" aria-selected="false">3D</button>
  </div>

  <div id="lienzo">
    <div id="envoltorio-banda">
      <img id="vista" alt="previsualización de la banda">
      <div id="capas-overlay"></div>
      <p id="pista">Arrastra una foto para moverla · rueda para escalar · Supr para borrarla</p>
    </div>
    <canvas id="visor" hidden></canvas>
  </div>
</main>

<aside class="panel" id="capas">
  <h2>Capas</h2>
  <label for="anadir">Añadir foto</label>
  <select id="anadir"></select>
  <label for="subir">Importar del disco</label>
  <input type="file" id="subir" accept="image/*">
  <ol id="lista-capas"></ol>
  <div id="detalle-capa" hidden>
    <h2>Capa seleccionada</h2>
    <label for="capa-scale">Tamaño</label>
    <input type="range" id="capa-scale" min="0.05" max="1.4" step="0.01">
    <label for="capa-gamma">Gamma</label>
    <input type="range" id="capa-gamma" min="0.4" max="2.2" step="0.05">
    <label for="capa-mask">Máscara</label>
    <select id="capa-mask"></select>
    <label class="check"><input type="checkbox" id="capa-ring"> Aro alrededor</label>
    <div class="fila">
      <button id="capa-subir">Subir</button>
      <button id="capa-bajar">Bajar</button>
    </div>
    <button id="capa-borrar" class="peligro">Borrar capa</button>
  </div>
</aside>

<script type="module" src="editor.js"></script>
</body>
</html>
